<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>울산 야화 | 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0b12;color:#f7e9da;font:15px system-ui,'Malgun Gothic',sans-serif}header{padding:23px 5%;background:#19121d;border-bottom:1px solid #8b6841;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;color:#e9c083;margin:0}h2{font-size:20px;color:#e9c083}main{max-width:1200px;margin:auto;padding:22px}section{background:#1b1721;border:1px solid #594459;border-radius:16px;padding:20px;margin:20px 0}input,textarea,select{background:#0f0d14;border:1px solid #786177;border-radius:8px;color:#fff;padding:12px;width:100%;font:inherit}textarea{min-height:80px}button{cursor:pointer;background:#d6ac73;border:0;border-radius:8px;padding:11px 17px;color:#1a1014;font-weight:700}button.alt{background:#523b54;color:white}button.danger{background:#9a3856;color:white}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:130px}label{display:block;margin-bottom:7px;color:#cdb6bd}.item{padding:13px;border-top:1px solid #4d394b}.muted{color:#b7a5b3}.hidden{display:none}.badge{display:inline-block;padding:4px 8px;background:#473449;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#message{position:sticky;top:0;background:#48314a;padding:10px;display:none;z-index:2}a{color:#f0c88c}small{color:#c4b6c4}
/* V13 responsive admin */
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}button,input,select,textarea{font-size:16px}button{min-height:44px;touch-action:manipulation}input,select{min-height:44px}.row>*{min-width:0}.field{flex:1 1 180px;min-width:0}header h1{overflow-wrap:anywhere}section{min-width:0}#message{overflow-wrap:anywhere}.item{overflow-wrap:anywhere}#reviews,#notices,#audit{min-width:0}
@media(max-width:700px){header{padding:14px 16px;gap:10px;flex-wrap:wrap}header h1{font-size:20px}header a{font-size:13px;white-space:nowrap}main{padding:10px 12px calc(36px + env(safe-area-inset-bottom))}section{padding:15px 13px;margin:12px 0;border-radius:12px}h2{font-size:18px;margin-top:3px}.row{gap:10px}.field{flex:1 1 100%;width:100%}.row>button{flex:1 1 auto}.actions{gap:8px}.actions button{flex:1 1 120px}.item{padding:12px 4px}#loginForm button{width:100%}#venueForm p>button,#noticeForm p>button{width:100%}#dashboard>.row{align-items:center}#dashboard>.row h2{flex:1 1 60%!important}#dashboard>.row button{flex:0 0 auto}}
@media(min-width:701px) and (max-width:1050px){main{padding:16px}.field{flex-basis:calc(50% - 12px)}}
</style><header><h1>夜花 · 관리자 센터</h1><a href="/" target="_blank">홈페이지 보기</a></header><main><div id="message"></div><section id="login"><h2>관리자 로그인</h2><p class="muted">서버에서 설정한 관리자 비밀번호를 입력하세요.</p><form id="loginForm" class="row"><div class="field"><input type="password" id="password" placeholder="관리자 비밀번호" required autocomplete="current-password"></div><button>로그인</button></form></section><div id="dashboard" class="hidden"><div class="row"><h2 style="flex:1">운영 관리</h2><button class="alt" id="logout">로그아웃</button></div><section><h2>업소 정보 · 출근표 · 요금</h2><p class="muted">23개 업소 중 하나를 선택해 수정하세요. 빈 숫자 칸은 '미등록'으로 표시됩니다.</p><div class="row"><div class="field"><label>업소 선택</label><select id="venueSelect"></select></div><button id="loadVenue" class="alt">정보 불러오기</button></div><form id="venueForm"><div class="row"><div class="field"><label>출근 인원</label><input id="people" type="number" min="0" placeholder="미등록"></div><div class="field"><label>예약 현황(명)</label><input id="reservations" type="number" min="0" placeholder="미등록"></div><div class="field"><label>기본 주대(원)</label><input id="price" type="number" min="0" placeholder="미등록"></div><div class="field"><label>T.C.(원)</label><input id="tc" type="number" min="0" placeholder="미등록"></div></div><div class="row" style="margin-top:12px"><div class="field"><label>영업시간</label><input id="hours" maxlength="100"></div><div class="field"><label>주차 안내</label><input id="parking" maxlength="100"></div></div><p><button>업소 정보 저장</button></p></form></section><section><h2>공지사항 관리</h2><form id="noticeForm"><textarea id="noticeBody" maxlength="500" placeholder="방문객에게 보여줄 공지를 입력하세요" required></textarea><p><button>공지 등록</button></p></form><div id="notices"></div></section><section><h2>후기 승인 관리</h2><p class="muted">방문객이 작성한 후기는 승인해야 공개됩니다. 후기 내용은 방문 인증된 사실로 표시하지 않습니다.</p><div id="reviews"></div></section><section><h2>최근 변경 기록</h2><div id="audit"></div></section></div></main><script>
let csrf='',data={};const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t){$('message').textContent=t;$('message').style.display='block';setTimeout(()=>$('message').style.display='none',4000)}async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'오류');return j}async function load(){data=await api('/api/admin');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('venueSelect').innerHTML=data.venues.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');fill();$('notices').innerHTML=data.notices.map(n=>`<div class="item">${esc(n.body)} <div class="actions"><button class="danger" data-notice="${n.id}">삭제</button></div></div>`).join('')||'<p class="muted">등록된 공지가 없습니다.</p>';$('reviews').innerHTML=data.reviews.map(r=>`<div class="item"><span class="badge">${esc(r.status)}</span> ${esc(data.venues[r.venue-1]?.name||'업소')} · ${'★'.repeat(r.rating)} · ${esc(r.nick)}<h3>${esc(r.title)}</h3><p>${esc(r.body)}</p><div class="actions"><button data-review="${r.id}" data-status="approved">승인</button><button class="alt" data-review="${r.id}" data-status="pending">대기</button><button class="danger" data-review="${r.id}" data-status="rejected">거절</button></div></div>`).join('')||'<p class="muted">등록된 후기가 없습니다.</p>';$('audit').innerHTML=data.audit.map(x=>`<div class="item">${esc(x.action)} · ${esc(x.detail)} · ${new Date(x.created*1000).toLocaleString('ko-KR')}</div>`).join('')||'<p class="muted">변경 기록이 없습니다.</p>'}
function fill(){let v=data.venues.find(v=>v.id===Number($('venueSelect').value));if(!v)return;for(let k of ['people','reservations','price','tc','hours','parking'])$(k).value=v[k]??''} $('venueSelect').onchange=fill;$('loadVenue').onclick=fill;$('loginForm').onsubmit=async e=>{e.preventDefault();try{let j=await api('/api/login',{password:$('password').value});csrf=j.csrf;$('password').value='';await load()}catch(e){msg(e.message)}};$('venueForm').onsubmit=async e=>{e.preventDefault();try{let d={id:Number($('venueSelect').value)};for(let k of ['people','reservations','price','tc','hours','parking'])d[k]=$(k).value;await api('/api/venue',d);await load();msg('업소 정보 저장 완료')}catch(e){msg(e.message)}};$('noticeForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/notice',{body:$('noticeBody').value});$('noticeBody').value='';await load();msg('공지 등록 완료')}catch(e){msg(e.message)}};document.addEventListener('click',async e=>{let b=e.target.closest('[data-notice],[data-review]');if(!b)return;try{if(b.dataset.notice){if(!confirm('공지를 삭제할까요?'))return;await api('/api/notice/delete',{id:Number(b.dataset.notice)})}else await api('/api/review/status',{id:Number(b.dataset.review),status:b.dataset.status});await load();msg('변경 완료')}catch(err){msg(err.message)}});$('logout').onclick=async()=>{await api('/api/logout',{});location.reload()};api('/api/me').then(j=>{if(j.authenticated){csrf=j.csrf;load()}}).catch(()=>{});
</script></html>
